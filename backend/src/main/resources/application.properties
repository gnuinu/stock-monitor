spring.application.name=stock-monitor
server.port=8080

# ── Market data source ───────────────────────────────────────────────
# provider: simulated (default, no keys) | kis (한국투자증권 OpenAPI, real data)
stockmonitor.market.provider=${MARKET_PROVIDER:simulated}
# Latest-candle refresh interval (ms). Simulator: 3000. KIS: raise to ~10000+ to be gentle on rate limits.
stockmonitor.market.refresh-ms=${MARKET_REFRESH_MS:3000}

# ── KIS OpenAPI (only used when provider=kis) ────────────────────────
# Issue an app key/secret at https://apiportal.koreainvestment.com and export as env vars.
stockmonitor.kis.app-key=${KIS_APP_KEY:}
stockmonitor.kis.app-secret=${KIS_APP_SECRET:}
# Production: https://openapi.koreainvestment.com:9443  |  모의투자: https://openapivts.koreainvestment.com:29443
stockmonitor.kis.base-url=${KIS_BASE_URL:https://openapi.koreainvestment.com:9443}
stockmonitor.kis.paper=${KIS_PAPER:false}
stockmonitor.kis.history-days=${KIS_HISTORY_DAYS:260}
