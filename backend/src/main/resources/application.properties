spring.application.name=stock-monitor
server.port=8080

# ── Market data source ───────────────────────────────────────────────
# provider: simulated (default, no network) | yahoo (Yahoo Finance, real data, no key/account)
stockmonitor.market.provider=${MARKET_PROVIDER:simulated}
# Latest-candle refresh interval (ms). Simulator: 3000. Yahoo: raise to ~10000+ to be gentle.
stockmonitor.market.refresh-ms=${MARKET_REFRESH_MS:3000}

# ── Yahoo Finance (only used when provider=yahoo) ────────────────────
# Public chart endpoint — no API key, no account required.
stockmonitor.yahoo.base-url=${YAHOO_BASE_URL:https://query1.finance.yahoo.com}
stockmonitor.yahoo.range=${YAHOO_RANGE:1y}
stockmonitor.yahoo.history-refresh-ms=${YAHOO_HISTORY_REFRESH_MS:600000}
